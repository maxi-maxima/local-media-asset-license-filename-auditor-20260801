name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile local_media_asset_license_filename_auditor_20260801/__init__.py local_media_asset_license_filename_auditor_20260801/cli.py tests/test_cli.py
      - run: python -m local_media_asset_license_filename_auditor_20260801.cli examples/assets --summary
